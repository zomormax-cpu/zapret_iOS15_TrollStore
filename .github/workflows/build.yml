name: Build Zapret IPA for TrollStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Swift App
      run: |
        mkdir -p Payload/Zapret6s.app
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swiftc App.swift \
          -parse-as-library \
          -sdk "$SDK_PATH" \
          -target arm64-apple-ios15.0 \
          -o Payload/Zapret6s.app/Zapret6s

    - name: Sign with TrollStore Entitlements
      run: |
        cat << 'EOF' > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.network.socket-delegate</key>
            <true/>
        </dict>
        </plist>
        EOF
        ldid -Sentitlements.plist Payload/Zapret6s.app/Zapret6s || codesign -f -s - --entitlements entitlements.plist Payload/Zapret6s.app/Zapret6s

    - name: Generate App Icon & Info.plist
      run: |
        cat << 'EOF' > make_icon.swift
        import Cocoa

        let size = NSSize(width: 1024, height: 1024)
        let image = NSImage(size: size)
        image.lockFocus()

        NSColor(calibratedRed: 0.05, green: 0.07, blue: 0.09, alpha: 1.0).setFill()
        NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()

        let borderRect = NSRect(x: 56, y: 56, width: 912, height: 912)
        let borderPath = NSBezierPath(roundedRect: borderRect, xRadius: 190, yRadius: 190)
        borderPath.lineWidth = 26
        NSColor(calibratedRed: 0.95, green: 0.45, blue: 0.25, alpha: 0.9).setStroke()
        borderPath.stroke()

        let text = "Z_" as NSString
        let font = NSFont.monospacedSystemFont(ofSize: 450, weight: .bold)
        let attrs: [NSAttributedString.Key: Any] = [
            .font: font,
            .foregroundColor: NSColor(calibratedRed: 0.95, green: 0.45, blue: 0.25, alpha: 1.0)
        ]
        let textSize = text.size(withAttributes: attrs)
        let textRect = NSRect(
            x: (1024 - textSize.width) / 2,
            y: (1024 - textSize.height) / 2 - 20,
            width: textSize.width,
            height: textSize.height
        )
        text.draw(in: textRect, withAttributes: attrs)

        image.unlockFocus()

        if let tiff = image.tiffRepresentation,
           let rep = NSBitmapImageRep(data: tiff),
           let png = rep.representation(using: .png, properties: [:]) {
            try! png.write(to: URL(fileURLWithPath: "icon_master.png"))
        }
        EOF

        swift make_icon.swift
        sips -z 120 120 icon_master.png --out Payload/Zapret6s.app/AppIcon60x60@2x.png
        sips -z 180 180 icon_master.png --out Payload/Zapret6s.app/AppIcon60x60@3x.png
        cp Payload/Zapret6s.app/AppIcon60x60@2x.png Payload/Zapret6s.app/Icon.png

        cat << 'EOF' > Payload/Zapret6s.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Zapret6s</string>
            <key>CFBundleIdentifier</key>
            <string>com.terminal.zapret6s</string>
            <key>CFBundleName</key>
            <string>Zapret</string>
            <key>CFBundleDisplayName</key>
            <string>Zapret</string>
            <key>CFBundleVersion</key>
            <string>1.10.4</string>
            <key>CFBundleShortVersionString</key>
            <string>1.10.4</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIBackgroundModes</key>
            <array>
                <string>audio</string>
                <string>fetch</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
                <key>CFBundlePrimaryIcon</key>
                <dict>
                    <key>CFBundleIconFiles</key>
                    <array>
                        <string>AppIcon60x60</string>
                        <string>Icon.png</string>
                    </array>
                    <key>UIPrerenderedIcon</key>
                    <true/>
                </dict>
            </dict>
        </dict>
        </plist>
        EOF

    - name: Package IPA
      run: |
        zip -r Zapret6s.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zapret6s-IPA
        path: Zapret6s.ipa
